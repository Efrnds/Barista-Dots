# tmux — Foot. SEM extended-keys: o cursor-agent só detecta Ctrl+V como byte 0x16.
set -g default-terminal "foot"
set -as terminal-overrides ",foot*:RGB"
set -g set-clipboard on
set -g allow-passthrough on
# NÃO ligar extended-keys — quebra R(t)=("\x16"===t) do agent

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g focus-events on
set -g renumber-windows on

set -g @resurrect-capture-pane-contents 'on'
run-shell '~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux' 2>/dev/null || true

bind ? list-keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
setw -g mode-keys vi
bind z select-pane -Z
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"

set -g status-interval 3
set -g status-left-length 24
set -g status-left '#[fg=#BDC8D3]#S '
set -g status-right '%H:%M'
set -g status-style "bg=#131314 fg=#E4E2E3"
set -g window-status-style "bg=#131314 fg=#7E8489"
set -g window-status-current-style "bg=#303031 fg=#E4E2E3"
set -g pane-border-style "fg=#4F5861"
set -g pane-active-border-style "fg=#BDC8D3"
