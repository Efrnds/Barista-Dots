# tmux — Barista Dots (tema DMS/Foot + QoL)

set -g default-terminal "foot"
set -ag terminal-overrides ",foot:RGB"

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g focus-events on
set -g renumber-windows on

# Plugin tmux-resurrect (hooks/setup-tmux.sh)
set -g @resurrect-capture-pane-contents 'on'
run-shell '~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux'

# Prefixo: Ctrl+b
bind ? list-keys

# Splits no diretório atual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navegação estilo vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
setw -g mode-keys vi

# QoL
bind z select-pane -Z
bind x confirm-before -p "matar pane #P? (y/n)" kill-pane
bind X confirm-before -p "matar janela #W? (y/n)" kill-window

# Recarregar config (R maiúsculo — r minúsculo fica pro resurrect restore)
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"

# resurrect: Ctrl+b Ctrl+s salvar | Ctrl+b Ctrl+r restaurar (defaults do plugin)

# Status bar — workspace Hyprland + cwd + sessão
set -g status-interval 3
set -g status-left-length 48
set -g status-left '#[fg=#BDC8D3]#(hyprctl activeworkspace -j 2>/dev/null | python3 -c "import json,sys; print(\"ws:\"+json.load(sys.stdin).get(\"name\",\"?\"))" 2>/dev/null)#[default] '
set -g status-right '#{pane_current_path} | #S  %H:%M'

set -g status-style "bg=#131314 fg=#E4E2E3"
set -g window-status-style "bg=#131314 fg=#7E8489"
set -g window-status-current-style "bg=#303031 fg=#E4E2E3"
set -g mode-style "bg=#55606A fg=#E4E2E3"
set -g message-style "bg=#303031 fg=#E4E2E3"

set -g pane-border-style "fg=#4F5861"
set -g pane-active-border-style "fg=#BDC8D3"
