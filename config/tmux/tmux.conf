# tmux — config básica (tema alinhado ao DMS/Foot)

set -g default-terminal "foot"
set -ag terminal-overrides ",foot:RGB"

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g focus-events on

# Prefixo padrão: Ctrl+b (prefix + ? para ajuda)
# Descomente para usar Ctrl+a:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Splits no diretório atual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navegação estilo vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
setw -g mode-keys vi

# Recarregar config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"

# Cores (DMS dark)
set -g status-style "bg=#131314 fg=#E4E2E3"
set -g status-left ""
set -g status-right "#S  %H:%M"
set -g window-status-style "bg=#131314 fg=#7E8489"
set -g window-status-current-style "bg=#303031 fg=#E4E2E3"
set -g mode-style "bg=#55606A fg=#E4E2E3"
set -g message-style "bg=#303031 fg=#E4E2E3"

# Pane borders
set -g pane-border-style "fg=#4F5861"
set -g pane-active-border-style "fg=#BDC8D3"
