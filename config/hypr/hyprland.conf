# ==============================================
# CONFIGURAÇÃO BASE HYPRLAND - TEMA LAVENDER DREAM
# ==============================================

# --- MONITORES ---
# Detecta automaticamente a resolução da VM (ou do monitor)
monitor=,preferred,auto,1

# --- VARIÁVEIS DE PROGRAMAS ---
$terminal = foot
$fileManager = foot -e yazi
$browser = zen-browser
$editor = /home/eduardo/Applications/cursor.AppImage
$menu = rofi -show drun

# --- AUTOSTART ---
# Inicia a barra superior, polkit, daemon de notificações, idle daemon e clipboard tracker
exec-once = waybar &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = awww-daemon & sleep 0.5 && awww restore
exec-once = systemctl --user start hyprpolkitagent
exec-once = mako &
exec-once = hypridle &
exec-once = ~/.config/hypr/scripts/bateria_status.sh &
exec-once = ~/.config/hypr/scripts/perifericos_bateria.sh &
exec-once = udiskie &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- VARIÁVEIS DE AMBIENTE (QT e Wayland) ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GTK_THEME,catppuccin-macchiato-lavender-standard+default

# --- TECLADO E MOUSE ---
input {
	kb_layout = br
	kb_variant =
	kb_model = thinkpad
	kb_options = 
	kb_rules =

	follow_mouse = 1

	touchpad {
		natural_scroll = true
	}

	sensitivity = 0
}

# --- VISUAL E DESIGN ---
source = ~/.config/hypr/theme_colors.conf

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2

    # Borda degrade elegante combinando com o tema
    col.active_border = $active_border
    col.inactive_border = $inactive_border

    layout = dwindle
}

decoration {
    rounding = 12

    active_opacity = 1
    inactive_opacity = 0.90

    # Otimizado para VirtualBox (passes de blur e sombras menores)
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = 000000
    }
}

animations {
    enabled = true

    # Curvas Bezier personalizadas para transições super limpas e fluidas
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind, slide
}


# --- REGRAS DE JANELAS (WINDOW RULES) ---
# Garante que diálogos do sistema, controle de som e bluetooth abram como janelas flutuantes
windowrule = match:class ^(pavucontrol)$, float 1
windowrule = match:class ^(blueman-manager)$, float 1
windowrule = match:class ^(nm-connection-editor)$, float 1
windowrule = match:class ^(thunar)$, match:title ^(Progresso da Operação de Arquivo)$, float 1
windowrule = match:class ^(thunar)$, match:title ^(File Operation Progress)$, float 1
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float 1

# Regras para o Spotify na área de trabalho especial (scratchpad)
windowrule = match:class ^(spotify|Spotify)$, float 1
windowrule = match:class ^(spotify|Spotify)$, workspace special:spotify
windowrule = match:class ^(spotify|Spotify)$, size 85% 85%
windowrule = match:class ^(spotify|Spotify)$, center 1

# Regras para o Super Productivity na área de trabalho especial (scratchpad)
windowrule = match:class ^([Ss]uper[ -]?[Pp]roductivity)$, float 1
windowrule = match:class ^([Ss]uper[ -]?[Pp]roductivity)$, workspace special:superproductivity
windowrule = match:class ^([Ss]uper[ -]?[Pp]roductivity)$, size 85% 85%
windowrule = match:class ^([Ss]uper[ -]?[Pp]roductivity)$, center 1

# Regras para o Btop flutuante
windowrule = match:class ^(btop-float)$, float 1
windowrule = match:class ^(btop-float)$, size 90% 80%
windowrule = match:class ^(btop-float)$, center 1

# Gamescope / Skyrim: Hyprland ignora -f e deixa janelinha flutuante — forçar fullscreen real
windowrule = match:class ^(gamescope)$, float 0
windowrule = match:class ^(gamescope)$, fullscreen 0
windowrule = match:class ^(steam_app_489830)$, fullscreen 0
windowrule = match:class ^(steam_app_3791709894)$, match:title (?i).*(skyrim|skse).*, fullscreen 0
windowrule = match:title (?i)^skyrim special edition$, fullscreen 0
windowrule = match:title (?i)^gamescope$, fullscreen 0


# --- ATALHOS DE TECLADO (KEYBINDS) ---
$mainMod = SUPER

# Aplicativos Essenciais
bind = $mainMod, F1, exec, ~/.config/hypr/scripts/keybinds.sh
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/toggle_theme.sh
bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, exec, $editor
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, G, exec, ~/.config/hypr/scripts/rofi_app_groups.sh
bind = $mainMod, M, exec, ~/.config/hypr/scripts/toggle_spotify.sh
bind = $mainMod, P, exec, ~/.config/hypr/scripts/toggle_superproductivity.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, ~/.config/hypr/scripts/edit_configs.sh
bind = $mainMod, V, togglefloating,
bind = $mainMod ALT, V, exec, ~/.config/hypr/scripts/rofi_volume_mixer.py
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod SHIFT, C, exec, rofi -show calc -modi calc -no-show-match -no-sort
bind = $mainMod, period, exec, rofi -show emoji -modi emoji
bind = $mainMod, B, exec, $browser
bind = CTRL SHIFT, ESCAPE, exec, foot -o main.font="JetBrainsMono Nerd Font:size=9.5" --app-id=btop-float -e btop # Monitor de Sistema (Btop)
bind = CTRL ALT, Delete, exec, wlogout # Menu de Desligar/Reboot (wlogout)
bind = $mainMod, S, exec, ~/.config/hypr/scripts/rofi_locate.sh # Busca de Arquivos (Rofi)
bind = $mainMod ALT, D, exec, ~/.config/hypr/scripts/rofi_calendar.sh # Calendário (Rofi)
bind = $mainMod ALT, Y, exec, ~/.config/hypr/scripts/rofi_vpn.sh # VPN Switcher (Rofi)
bind = $mainMod, I, exec, ~/.config/hypr/scripts/rofi_network_info.sh # Info de Rede (Rofi)
bind = $mainMod ALT, U, exec, ~/.config/hypr/scripts/rofi_audio_switcher.sh # Alternador de Áudio (Rofi)
bind = $mainMod ALT, S, exec, ~/.config/hypr/scripts/rofi_ssh.sh # Gerenciador SSH (Rofi)
bindl = , switch:on:Lid Switch, exec, loginctl lock-session # Travar ao fechar a tampa
bind = $mainMod, W, exec, ~/.config/hypr/mudar_fundo.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/mudar_fundo.sh --like
bind = $mainMod ALT, W, exec, ~/.config/hypr/mudar_fundo.sh --local
bind = $mainMod CTRL, W, exec, ~/.config/hypr/scripts/rofi_wallpapers.sh
bind = $mainMod, F, fullscreen, 1 # Tela cheia inteligente
bind = $mainMod SHIFT, F, fullscreen, 0 # Tela cheia real
bind = $mainMod, N, exec, ~/.config/hypr/scripts/rofi_notifications.sh
bind = $mainMod, A, exec, ~/.config/hypr/scripts/rofi_media.sh
bind = $mainMod, ESCAPE, exec, makoctl dismiss
bind = $mainMod SHIFT, ESCAPE, exec, makoctl dismiss -a

# Controle de Foco (usando as setas do teclado)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Redimensionar Janelas (SUPER + CTRL + Setas)
binde = $mainMod CTRL, left, resizeactive, -30 0
binde = $mainMod CTRL, right, resizeactive, 30 0
binde = $mainMod CTRL, up, resizeactive, 0 -30
binde = $mainMod CTRL, down, resizeactive, 0 30

# Redimensionar com SUPER + +/- (Horizontal) e SUPER + SHIFT + +/- (Vertical)
binde = $mainMod, minus, resizeactive, -40 0
binde = $mainMod, equal, resizeactive, 40 0
binde = $mainMod, plus, resizeactive, 40 0
binde = $mainMod, kp_subtract, resizeactive, -40 0
binde = $mainMod, kp_add, resizeactive, 40 0

binde = $mainMod SHIFT, minus, resizeactive, 0 -40
binde = $mainMod SHIFT, equal, resizeactive, 0 40
binde = $mainMod SHIFT, plus, resizeactive, 0 40
binde = $mainMod SHIFT, kp_subtract, resizeactive, 0 -40
binde = $mainMod SHIFT, kp_add, resizeactive, 0 40

# Mover Janelas Ativas (SUPER + SHIFT + Setas)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Alternar entre as Áreas de Trabalho (1 a 10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover a janela ativa para outra Área de Trabalho (1 a 10)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mudar de workspace usando o Scroll do Mouse (SUPER + Scroll)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mover e redimensionar janelas flutuantes com o mouse (SUPER + Clique Esquerdo/Direito)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Histórico da Área de Transferência (SUPER + H)
bind = $mainMod, H, exec, cliphist list | rofi -dmenu -p "Área de Transferência" | cliphist decode | wl-copy

# Tela de Bloqueio (SUPER + L)
bind = $mainMod, L, exec, loginctl lock-session

# Captura de Tela (Screenshots com Grim e Slurp)
# Print Screen (Selecionar área e editar no Swappy)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
# Print -> Copia área selecionada para a área de transferência
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send -u low -t 1500 "Print Screen" "Captura da área copiada para a área de transferência!"
# Shift + Print -> Tira print de toda a tela e salva em ~/Pictures/Screenshots/
bind = SHIFT, Print, exec, grim ~/Pictures/Screenshots/Screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send -u low -t 1500 "Print Screen" "Captura de tela inteira salva em Imagens/Screenshots!"
# Ctrl + Print -> Tira print da área selecionada e salva em ~/Pictures/Screenshots/
bind = CTRL, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/Screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send -u low -t 1500 "Print Screen" "Captura de área salva em Imagens/Screenshots!"

# Controle de Brilho da Tela (com notificações visuais)
binde = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up
binde = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down

# Controle de Áudio (com notificações visuais)
binde = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh up
binde = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh down
bind  = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh mute

# Controle de Mídia (Play/Pause, Próxima, Anterior)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
