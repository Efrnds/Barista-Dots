# Foot — terminal padrão (Ctrl+V no cursor-agent cola imagem)
term=foot
login-shell=yes
font=JetBrainsMono Nerd Font:size=9.3
pad=15x15 center
initial-color-theme=dark

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
foreground=5F6267
background=101418
regular0=101418
regular1=EF6B92
regular2=68D075
regular3=FFF772
regular4=5C90C5
regular5=003D64
regular6=74A1D0
regular7=CDD5DA
bright0=3E4347
bright1=FF9FBB
bright2=A2F9AD
bright3=FFFAA5
bright4=8EB8E4
bright5=B0D6FF
bright6=CCE5FF
bright7=F8FCFF

[key-bindings]
# Texto: Ctrl+Shift+V. Ctrl+V livre pro cursor-agent ([Imagem #N]).
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
